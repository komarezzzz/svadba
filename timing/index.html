<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1c10">
<meta name="robots" content="noindex, nofollow">
<meta name="format-detection" content="telephone=no">
<title>Тайминг. Виктория и Никита</title>
<style>
@font-face{font-family:"Kalissa";src:url("fonts/kalissa-sub.woff2") format("woff2");font-display:block}
@font-face{font-family:"FinH";src:url("fonts/finlandica.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"AleksandraC";src:url("fonts/AleksandraC.otf") format("opentype");font-display:swap}
:root{--W:360px;--hdr:64px;--pencil:#2f2d2a;--soft:#57524b;--rust:#8a5a2b;--paper:#f6efe0;--ease-out:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-width:none;background:#2a1c10;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none;scroll-padding-top:calc(var(--hdr) + 12px)}
/* overflow-x на body уходит во viewport, sticky не ломается */
body{font-family:"AleksandraC",Georgia,serif;color:var(--pencil);background:#2a1c10;overflow-x:hidden;overflow-x:clip;overscroll-behavior:none}
#svh{position:fixed;left:0;top:0;width:0;height:100vh;height:100svh;visibility:hidden;pointer-events:none}
.hidden,[hidden]{display:none!important}
/* общая шапка шагов (steps-header.js): над столом и плашкой, под шторкой */
body>header.sh{z-index:16}

.stage{position:relative;height:1100vh}
.view{position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden;overflow:clip;isolation:isolate}
body.rm .stage{height:auto}
/* интро-видео: камера опускается от окна к столу; скролл ведёт кадры; поверх всего, кроме шапки */
#kitchen{position:absolute;z-index:0;left:0;top:0;max-width:none;pointer-events:none;display:none}
#haze{position:absolute;z-index:4;left:0;right:0;pointer-events:none;display:none;background:linear-gradient(rgba(236,228,214,0),rgba(236,228,214,.9) 42%,rgba(236,228,214,.9) 55%,rgba(236,228,214,0))}
body.rm #kitchen,body.rm #haze,body.rm #hello{display:none!important}
/* шапка-приветствие: слова проступают и уезжают вверх по скроллу интро (AleksandraC — утверждённый шрифт студии, Finlandica — подпись) */
#hello{position:absolute;z-index:6;left:0;right:0;top:45%;padding:0 3vw;text-align:center;pointer-events:none;display:none;color:#3a2616;text-shadow:0 .02em .22em rgba(255,246,230,.5)}
#hello .l1{display:block;white-space:nowrap;font-family:"Kalissa","AleksandraC",Georgia,serif;font-size:clamp(46px,14.2vw,280px);line-height:1;letter-spacing:.005em;transform:rotate(-3deg);transform-origin:50% 60%}
#hello .l2{display:block;margin:1.5em auto 0;padding-left:5vw;max-width:min(30em,92vw);text-wrap:balance;font-family:"FinH","AleksandraC",Georgia,serif;font-weight:700;font-size:clamp(17px,3vw,44px);line-height:1.32;letter-spacing:.01em;color:#2a1a0c;text-shadow:0 0 .35em rgba(255,244,222,.75),0 .03em .12em rgba(255,246,230,.6)}
/* запас вокруг слова: хвосты рукописного шрифта выходят за рамку слова, на iPhone слой слова их обрезал (последняя «о»); padding+минус margin оставляют положение прежним */
#hello .w{display:inline-block;padding:.12em .34em .22em .34em;margin:-.12em -.2em -.22em -.2em}
#hello .w{animation:helloW .95s cubic-bezier(.2,.8,.2,1) var(--d,0ms) backwards}
@keyframes helloW{from{opacity:0;transform:translateY(46px) scale(.97)}}
/* загрузка: пока шрифты, кухня, стол и бумага не готовы, экран закрыт шторкой цвета фона; слова шапки стоят на паузе и вылетают после неё */
#hello .w{animation-play-state:paused}html.go #hello .w{animation-play-state:running}
#curtain{position:fixed;inset:0;z-index:99999;background:#2a1c10;pointer-events:none;transition:opacity .6s ease}html.go #curtain{opacity:0}
@media (prefers-reduced-motion:reduce){#hello .w{animation:none}}
/* hello-up: на вертикальном экране надпись стоит выше стола, на светлом окне */
@media (max-aspect-ratio:1/1){#hello{top:22%}}
/* hello-up-land: на горизонтальном экране надпись по центру светлой зоны, между шапкой и краем стола (край стола = .451 высоты) */
@media (min-aspect-ratio:1001/1000){#hello{top:calc(22.5vh + 39px);transform:translateY(-50%)}#hello .l1{font-size:min(14.2vw,17vh)}#hello .l2{margin-top:.8em;padding-left:0;font-size:clamp(13px,3.4vh,44px)}}
/* l2 вправо: хвост «В» не касается «Седьмое» (проверено 844×390 … 2560×1440); у почти квадратных экранов сдвига нет, там строка не влезет */
@media (min-aspect-ratio:13/10){#hello .l2{position:relative;left:5.75em}}
@media (min-aspect-ratio:3/2){#hello .l2{left:6.5em}}
@media (min-aspect-ratio:1001/1000) and (max-aspect-ratio:13/10){#hello .l2{margin-top:1.9em}}
/* кнопка «наверх» в самом конце: сначала тихая, через пару секунд начинает мигать стрелкой */
.totop{position:fixed;z-index:17;right:calc(14px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;cursor:pointer;
  background:rgba(51,50,47,.92);color:#f6efe0;box-shadow:0 6px 18px rgba(30,15,5,.45),inset 0 0 0 1px rgba(255,255,255,.16);opacity:0;visibility:hidden;transform:translateY(12px);transition:opacity .5s ease,transform .5s ease,visibility 0s .5s;-webkit-tap-highlight-color:transparent}
.totop svg{width:26px;height:26px;display:block}
.totop.on{visibility:visible;opacity:.22;transform:none;transition:opacity .5s ease,transform .5s ease;animation:totopBlink 1.5s ease-in-out 2.2s infinite}
.totop:focus-visible{outline:2px solid #f6efe0;outline-offset:3px}
@keyframes totopBlink{0%,100%{opacity:.22;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){.totop.on{animation:none;opacity:.9}}
body.rm .view{position:relative}

/* пол (финал): картинка из final/, пока её нет — тёплые доски */
/* земля: пол, коврик и вещи одним слоем; в конце камера поднимается над столом, пол дальше стола и уменьшается медленнее (параллакс) */
#ground{position:absolute;inset:0;z-index:0;transform-origin:0 0;pointer-events:none}
#floor{position:absolute;inset:0;z-index:0;background-color:#b98f5c;background-position:center;
  background-image:repeating-linear-gradient(90deg,rgba(48,28,12,.38) 0 2px,transparent 2px 22vmin),
    repeating-linear-gradient(90deg,rgba(255,236,206,.05) 0 7vmin,rgba(0,0,0,.05) 7vmin 15vmin,transparent 15vmin 22vmin),
    repeating-linear-gradient(0deg,rgba(255,240,220,.035) 0 1px,transparent 1px 5px)}
#floor.img{background-size:cover;background-repeat:no-repeat}
#floor.intro{background-image:none!important;background-color:#c9a06b}
/* коврик (финал): лежит на полу под упавшим листом, проявляется, когда стол уезжает */
#rug{position:absolute;z-index:0;left:0;top:0;opacity:0;pointer-events:none;transform-origin:50% 50%;
  filter:drop-shadow(0 calc(var(--W,1000px)*.012) calc(var(--W,1000px)*.03) rgba(20,10,2,.4))}
/* предметы пола (тапочки, миска, мышка, носок): лежат вокруг коврика, проявляются вместе с ним; нет файла — предмета нет */
#pol{position:absolute;inset:0;z-index:0;opacity:0;pointer-events:none}
#pol img{position:absolute;display:block;height:auto;max-width:none;transform-origin:50% 50%;filter:drop-shadow(0 2px 3px rgba(30,14,4,.5))}

/* мир камеры: стол, вещи, снимки */
.layer{position:absolute;left:0;top:0;transform-origin:0 0}
#world{z-index:1}
/* вещи на узком экране: над листом, на его полях (рядом с текстом не ставятся); камера та же, что у листа */
#objTop{z-index:3;pointer-events:none}
/* will-change только пока камера меняет масштаб; на чтении снимается, чтобы текст и снимки перерисовались резко */
.layer.wc{will-change:transform}
#itable{position:absolute;left:0;top:0;display:none;background:#c9a06b url("stol-oak-tile.webp") repeat;box-shadow:0 -14px 22px -4px rgba(34,20,8,.55),inset 0 4px 0 rgba(255,238,205,.28)}
#tableW{position:absolute;left:0;top:0;background:#c9a06b url("stol-oak-tile.webp") repeat}
.bn{margin:calc(var(--W)*.035) 0 calc(var(--W)*.012);font-size:max(calc(var(--W)*.034),.8rem);letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.bn::after{content:"";display:block;height:0;border-top:1px solid rgba(87,82,75,calc(.35*var(--rv,1)));margin-top:.25em}
.obj{position:absolute;left:0;top:0;max-width:none;height:auto;pointer-events:none;user-select:none;
  filter:drop-shadow(calc(var(--W)*.012*var(--fx,1)) calc(var(--W)*.02) calc(var(--W)*.02) rgba(40,20,5,.45))}
.photo{position:absolute;left:0;top:0;display:none;background:#fbf8f1;pointer-events:none;
  box-shadow:calc(var(--W)*.006) calc(var(--W)*.014) calc(var(--W)*.03) rgba(40,20,5,.45)}
.photo img{display:block;width:100%;height:auto}
/* полароид: белая рамка, широкий низ; за фигурами карандашный рисунок комнаты/улицы/зала/поля (fony/), фигуры поверх */
.photo{padding:calc(var(--W)*.022) calc(var(--W)*.022) calc(var(--W)*.075)!important;background:#fbfaf5}
.photo img{background:#fff}
/* рисунки внутри листа — прозрачные, без фона (Григорий 20.10); карандашный фон и рамка — только у фотокарточек на столе */
.photo.onp{transition:opacity .9s ease-out}
body.wide .photo{display:block}

#vignette{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse 80% 75% at 50% 45%,transparent 45%,rgba(30,14,4,.45))}
body.rm #vignette{display:none}

/* лист */
#sheetWrap{position:absolute;inset:0;z-index:3;transform-origin:50% 50%}
#nudge{position:absolute;inset:0;transform-origin:50% 50%}
.sheet{position:absolute;left:calc(var(--W)/-2);top:0;width:var(--W)}
.sheet.nopaper{background:#f3e8cf;box-shadow:0 calc(var(--W)*.02) calc(var(--W)*.05) rgba(30,15,4,.5)}
.sheet .tl{position:absolute;max-width:none;pointer-events:none;user-select:none}
.sheet .midtile{position:absolute;background-repeat:repeat-y;pointer-events:none}
.content{position:relative;padding:calc(var(--W)*.2) calc(var(--W)*.12) calc(var(--W)*.3)}
h1{font-weight:400;font-size:calc(var(--W)*.1);line-height:1;margin-bottom:calc(var(--W)*.025);transform:rotate(-1.2deg);transform-origin:50% 50%;white-space:nowrap;text-align:center}
.sub{font-size:max(calc(var(--W)*.038),.8rem);color:var(--soft);margin-bottom:calc(var(--W)*.05)}
.legend{display:flex;flex-wrap:wrap;gap:.3em 1.1em;margin:0 0 calc(var(--W)*.05);font-size:max(calc(var(--W)*.032),.78rem);color:var(--soft)}
.legend>span{display:inline-flex;align-items:center;gap:.35em}
.row{display:grid;grid-template-columns:minmax(calc(var(--W)*.25),max-content) minmax(0,1fr);column-gap:calc(var(--W)*.03);align-items:baseline;
  padding:calc(var(--W)*.014) 0;border-bottom:1px dashed rgba(70,65,58,.3)}
.row .t{font-size:max(calc(var(--W)*.034),.78rem);color:var(--soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.row .s{font-size:max(calc(var(--W)*.042),.95rem);line-height:1.18;overflow-wrap:anywhere}
.row .n{display:block;font-size:max(calc(var(--W)*.03),.76rem);color:var(--soft);line-height:1.25;margin-top:calc(var(--W)*.005)}
.row{border-bottom-color:rgba(70,65,58,calc(.3*var(--rv,1)))}
.row.brk{padding:calc(var(--W)*.006) 0}
.row.brk .s{font-size:max(calc(var(--W)*.032),.8rem);color:var(--soft);font-style:italic}
.row.blk{cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:2px}
/* иконка блока висит слева от названия; строки названия и описания выровнены по ней */
.row.blk .s{position:relative;padding-left:1.5em}
.row.blk.icw .s{padding-left:1.7em}
.ic{position:absolute;left:0;top:.02em;width:1.15em;height:1.15em;pointer-events:none;transform:rotate(-3deg)}
.ic.w{width:1.35em}
.ic svg{display:block;width:100%;height:100%;overflow:visible;fill:none;stroke:var(--pencil);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
/* маркер под названием читаемого блока */
.ttl{background:linear-gradient(rgba(255,204,80,.62),rgba(255,204,80,.62)) 0 88%/0 38% no-repeat;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-size .3s ease-out}
.row.blk.hl .ttl{background-size:100% 38%}
@media (hover:hover){.row.blk:hover .ttl{background-size:100% 38%}}
/* скетчи внутри листа (узкий экран): боковые картинки разного размера, строки тайминга идут подряд и обтекают их.
   Без масок и clip-path (рисунок не режется); появление — плавный fade со сдвигом ≤12px, класс .in ставится один раз и не снимается */
.content{display:flow-root}
.bn{display:flow-root}
figure.sk{--r:2deg;--sw:40;--ks:1;--mo:-.04;float:right;clear:both;position:relative;width:calc(var(--sw)*var(--ks)*1%);
  margin:calc(var(--W)*.012) calc(var(--W)*var(--mo)) calc(var(--W)*.025) calc(var(--W)*.035);
  opacity:0;transform:rotate(var(--r)) translateY(10px) scale(.98);
  transition:opacity .55s var(--ease-out),transform .55s var(--ease-out)}
figure.sk.l{float:left;margin:calc(var(--W)*.012) calc(var(--W)*.035) calc(var(--W)*.025) calc(var(--W)*var(--mo))}
figure.sk.in{opacity:1;transform:rotate(var(--r))}
/* текст и рисунки на бумаге проявляются один раз, когда интро закончилось (класс .ink на .content); по прокрутке больше не пересчитываются */
.content>*{opacity:0;transition:opacity .9s ease-out}
.content.ink>*{opacity:1}
.content.ink>figure.sk{transform:rotate(var(--r))}
body.rm .content>*{opacity:1;transition:none}
figure.sk img{display:block;width:100%;height:auto;mix-blend-mode:multiply}
body.rm figure.sk{opacity:1;transform:rotate(var(--r));transition:none}
body.wide figure.sk{display:none}
/* телефон: часть рисунков ушла снимками на стол; крупные стоят по центру листа, у первого танца низ растворяется (без обрезанных ног) */
body:not(.wide) figure.sk.tbl{display:none}
body:not(.wide) .photo.tbl{display:block;padding:calc(var(--W)*.012) calc(var(--W)*.012) calc(var(--W)*.04)}
figure.sk.big{float:none;clear:both;margin-left:auto;margin-right:auto;margin-top:calc(var(--W)*.02)}
figure.sk.fade img{-webkit-mask-image:linear-gradient(#000 58%,transparent 94%);mask-image:linear-gradient(#000 58%,transparent 94%)}

/* пометки от руки поверх текста (одинаково на телефоне и мониторе, Григорий 20.10): цветное время, волнистое подчёркивание названий разными чернилами, обведённая длительность, красные стрелки */
.row .t{color:#8a5a2b;font-style:italic}
.row.blk .ttl{font-weight:600;text-decoration-line:underline;text-decoration-style:wavy;text-decoration-thickness:1.4px;text-underline-offset:.22em;text-decoration-skip-ink:none}
.row.mk0 .ttl{text-decoration-color:rgba(45,95,168,.8)}
.row.mk1 .ttl{text-decoration-color:rgba(165,55,38,.8)}
.row.mk2 .ttl{text-decoration-color:rgba(61,122,74,.8)}
.row.mk3 .ttl{text-decoration-color:rgba(138,90,43,.9)}
.row .mins{position:relative;display:inline-block;vertical-align:.14em;margin:.45em 0 .25em .15em;padding:.02em .6em;color:#9c3b28;font-style:italic;font-weight:600}
.row .mins::after{content:"";position:absolute;inset:-.1em -.05em;border:1.6px solid rgba(165,55,38,.78);border-radius:52% 48% 55% 45%/58% 50% 50% 46%;transform:rotate(-2.4deg);pointer-events:none}
.row.mk1 .mins::after,.row.mk3 .mins::after{border-radius:46% 54% 48% 52%/52% 56% 44% 50%;transform:rotate(1.8deg)}
.row .dsc{display:block;color:#3f3b35}
.row .dsc .ar{font-style:normal;font-weight:700;color:#b3402e}
.row.brk .s{color:#5b7a63}

/* ЛИСТ-ПОЛОТНО (телефон): время зелёное, подчёркивания: зелёное ушло на коричневый (бывший цвет времени); между блоками пунктир фломастером */
.row .t{color:#2f6f3f;font-style:italic;font-weight:600}
.row.mk2 .ttl{text-decoration-color:rgba(138,90,43,.9)}
.row.mk3 .ttl{text-decoration-color:rgba(176,122,26,.9)}
.row.brk .s,.row.brk .t{color:#2f6f3f}
.row.brk .s{display:flex;align-items:center;gap:.5em}
.row.brk .s{font-size:max(calc(var(--W)*.036),.72rem)}
.dnc svg{width:2.2em}
.dnc{display:inline-block;flex:none}.dnc svg{display:block;width:2.6em;height:1.25em;overflow:visible}
.bn{position:relative;margin-top:calc(var(--W)*.09);padding-top:calc(var(--W)*.035)}
.bn::before{content:"";position:absolute;left:-1%;right:-1%;top:0;height:0;border-top:3.5px dashed rgba(38,92,158,.55);border-radius:3px;transform:rotate(-.5deg);opacity:calc(var(--rv,1))}
.row.blk{margin-bottom:calc(var(--W)*.03)}
.row.brk{margin-top:calc(var(--W)*.02);margin-bottom:calc(var(--W)*.02)}
/* три этапа музыкальной игры: фишки с рукописными цифрами, вразброс и под наклоном */
.stg{display:flex;flex-wrap:wrap;gap:calc(var(--W)*.03) calc(var(--W)*.035);margin-top:calc(var(--W)*.03)}
.stc{display:inline-flex;align-items:center;gap:.45em;padding:.2em .7em .2em .25em;border:1.6px solid rgba(70,65,58,.5);border-radius:999px 999px 999px 999px/60% 60% 60% 60%;background:rgba(255,250,236,.55);font-weight:600;line-height:1.1;white-space:nowrap}
.stc i{font-style:normal;display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:#2f6f3f;color:#f6efe0;font-size:.92em}
.stc.c0{transform:rotate(-2.2deg)}.stc.c1{transform:rotate(1.6deg) translateX(.8em)}.stc.c2{transform:rotate(-1deg) translateX(.2em)}
.stc.c1 i{background:#a53726}.stc.c2 i{background:#2d5fa8}
/* зазор перед блоком: появляется, только если снимкам рядом не хватило места */
.gap{display:block;height:0}
/* конец листа (Григорий 20.10): разлиновка, ниже маркером «Дискотэка + кальяны»; фикус — в правом нижнем углу */
.endnote{clear:both;position:relative;margin-top:calc(var(--W)*.05);padding-bottom:calc(var(--W)*.03)}
.endnote::before{content:"";display:block;height:calc(var(--W)*.3);margin-bottom:calc(var(--W)*.035);
  background:repeating-linear-gradient(transparent 0 calc(var(--W)*.072),rgba(45,95,168,.38) calc(var(--W)*.072) calc(var(--W)*.075))}
.endnote b{display:block;font-family:"AleksandraC",Georgia,serif;font-weight:700;font-size:calc(var(--W)*.085);line-height:1.1;color:#1f3f8a;transform:rotate(-3deg);transform-origin:0 50%;letter-spacing:.01em;
  text-shadow:.5px .5px 0 rgba(31,63,138,.5),-.4px .3px 0 rgba(31,63,138,.35)}
figure.sk.corner{float:right;clear:none;margin-top:calc(var(--W)*.02);margin-right:calc(var(--W)*-.06)}
@media (max-width:600px),(max-height:500px){
  .row .t{font-size:max(calc(var(--W)*.04),.78rem)}
  .row .s{font-size:max(calc(var(--W)*.048),.95rem)}
  .row .n{font-size:max(calc(var(--W)*.038),.76rem)}
  .row.brk .s{font-size:max(calc(var(--W)*.04),.8rem)}
  .sub,.legend{font-size:max(calc(var(--W)*.04),.78rem)}
}
/* картинки лежат в листе (всё, кроме самого широкого экрана, где снимки на столе): строки идут подряд обычным потоком и обтекают картинки построчно

    if(!TAIL.asked&&rawP0>.5)tailLoad();// кадры хвоста грузим, только когда читатель дошёл до середины листа (память телефона)
    var qq=STAIL?clamp((sy-stageTop-stageH+ih)/STAIL,0,1):0,rawP=p,pe=tailStep(p),tailBusy=TAIL.on&&rawP>TAIL.A-.012&&rawP<TAIL.B+.015;p=pe;
    var tilt=0;
    if(INTRO&&ip<1){var te=clamp((ip-.46)/.54,0,1);te=te*te*(3-2*te);te=te*te*(3-2*te);tilt=TH0*(1-te)}
    var pre=tilt>.02?"translate("+(vw/2)+"px,"+YC+"px) perspective("+PERSP+"px) rotateX("+tilt+"deg) translate("+(-vw/2)+"px,"+(-YC)+"px) ":"";
    if(INTRO){var ton=tilt>.02;if(ton!==itOn){itOn=ton;floor.classList.toggle("intro",ton);itable.style.display=ton?"block":"none";tableW.style.visibility=ton?"hidden":"visible"}}
    // верхняя шапка уезжает вверх вместе с надписью и возвращается, когда прокрутили назад к началу
    if(INTRO){var shd=D.querySelector("header.sh");if(shd){var sh=clamp((ip-.27)/.1,0,1);sh=sh*sh*(3-2*sh);
      if(sh!==SHH){SHH=sh;shd.style.transform=sh>0?"translate3d(0,"+(-sh*(HDR+26)).toFixed(1)+"px,0)":"";shd.style.opacity=sh>.98?"0":"";shd.style.pointerEvents=sh>.5?"none":"";shd.style.visibility=sh>.98?"hidden":""}}}
    if(INTRO){var hw=hello.querySelectorAll(".w"),hj,hd;// слова шапки: вылетают сами по CSS при загрузке (не зависят от кадров камеры); дальше по скроллу уезжают вверх и гаснут
      hello.style.display=ip<1?"block":"none";
      if(!HELLO_ON){if(window.__go&&!HELLO_T0){HELLO_T0=performance.now();setTimeout(function(){HELLO_ON=true;requestFrame()},2300)}if(ip>.02)HELLO_ON=true}
      if(HELLO_ON)for(hj=0;hj<hw.length;hj++){// гаснут в том же порядке, как появились
        hd=Math.pow(clamp((ip-.31)/.07,0,1),2);   // надпись гаснет к ip≈.67, текст на листе начнётся только после ip=1: между ними около секунды прокрутки
        hw[hj].style.opacity=(1-hd).toFixed(3);
        hw[hj].style.transform="translateY("+(-hd*vh*.3-ip*vh*.03).toFixed(1)+"px) scale("+(1+hd*.03).toFixed(3)+")"}}
    if(INTRO){// окно кухни и дымка ползут вверх вместе с линией горизонта; в конце уходят совсем
      var yh=YC-PERSP/Math.tan(Math.max(tilt,.5)*Math.PI/180);
      var tr=tilt*Math.PI/180,ye=YC+U_EDGE*Math.cos(tr)*PERSP/(PERSP-U_EDGE*Math.sin(tr));// дальний край стола на экране
      kitchen.style.transform="translateY("+(ye-parseFloat(kitchen.style.height)+2)+"px)";
      kitchen.style.visibility=tilt>.5?"visible":"hidden"}
    var s,cy,e,f=0;
    if(p<.02){s=s0;cy=y0}
    else if(p<.2){e=ease((p-.02)/.18);s=lerp(s0,1,e);cy=(vh/2-lerp(.22,TOPF,e)*vh)/s}
    else if(p<.78){s=1;cy=lerp(y1,y2,(p-.2)/.58)}
    // конец чтения: камера смотрит строго вниз, поднимается (масштаб падает) и уходит к краю стола; стол и лист стоят, это один мир
    else{e=ease((p-.78)/.12);s=Math.exp(Math.log(TF)*e);cy=lerp(y2,CWF,e)}
    if(p>.9)f=ease((p-.9)/.05);
    if(TAIL.hold)f=0;
    setWC((p>.03&&p<.21)||(p>.77&&p<.97));// слой поднят только пока меняется масштаб
    var tx=vw/2,ty=vh/2-s*cy,cam=pre+"translate3d("+tx+"px,"+ty+"px,0) scale("+s+")";
    world.style.transform=cam;objTop.style.transform=cam;
    // пол дальше стола: при той же камере он крупнее в начале и уменьшается медленнее; точка под камерой сдвигается вместе с ней
    if(p>.6){var gF=1/(RHO+(1-RHO)*TF/s),gC=clamp(vh/2+(cy-CWF)*TF*(1-RHO),vh/(2*gF),vh-vh/(2*gF)),
      gt="translate("+(vw/2*(1-gF)).toFixed(1)+"px,"+(vh/2-gF*gC).toFixed(1)+"px) scale("+gF.toFixed(4)+")";
      if(gt!==lastG){ground.style.transform=gt;lastG=gt}}
    else if(lastG){ground.style.transform="";lastG=""}
    if(f>0){// лист сползает с края стола и падает на коврик: сначала едет по столу, потом удаляется (меньше), качается и ложится с поворотом
      var g=clamp(f/.3,0,1),h=clamp((f-.3)/.7,0,1),eh=ease(h),sw=Math.sin(h*Math.PI*3)*(1-h),sw2=Math.sin(h*Math.PI*2.2+1)*(1-h),
        y0s=vh/2+TF*(H/2-CWF),Yc=h>0?lerp(EF,vh/2+FY,eh):lerp(y0s,EF,g*g),Sc=h>0?lerp(TF,s3*SC_END,eh)*(1+.05*Math.sin(h*Math.PI)):TF;
      sheetLayer.style.transform=pre+"translate3d("+(vw/2+sw*vw*.04).toFixed(1)+"px,"+Yc.toFixed(1)+"px,0) perspective("+(vh*1.5)+"px) rotateX("+(sw2*16).toFixed(2)+"deg) rotateY("+(sw*13).toFixed(2)+"deg) rotate("+(sw*8+eh*ROT_END).toFixed(2)+"deg) scale("+(Sc*SX).toFixed(4)+","+Sc.toFixed(4)+") translate(0,"+(-H/2)+"px)"}
    else sheetLayer.style.transform=SX!==1&&p>.78?cam+" scale("+lerp(1,SX,ease((p-.78)/.12)).toFixed(4)+",1)":cam;
    revealFrame(s,cy,rawP);
    var fl=f>0&&f<1?Math.sin(clamp((f-.3)/.7,0,1)*Math.PI):0,wt=fl>0?"x":"none";
    if(wt!==lastWrap||fl>0){sheetWrap.style.transform="none";lastWrap=wt;
      // тень от листа: в полёте мягкая и далеко, на полу короткая и плотная
      sheetWrap.style.filter=fl>0?"drop-shadow(0 "+(6+fl*vh*.05)+"px "+(8+fl*vh*.045)+"px rgba(30,16,6,"+(.3+.12*fl)+"))":""}
    if(rugOK){var rf=p>.6?1:0;polBox.style.opacity=rf;rug.style.opacity=rf;rug.style.transform="rotate("+RUG.rot+"deg)"}
    setHL(p>.2&&p<.78?cy+RL:null);
    setOk(TAIL.on?rawP>TAIL.B:(p>.78&&!tailBusy));
    setTop(STAIL?qq>.97:(p>.985&&!tailBusy));
    if(p>.6)loadFinal();
    lastP=p;
    if(pawOK&&!RM)pawScroll(rawP>=.999&&!tailBusy?qq:-1);
  }

  /* ===== мяу (пасхалка): синтез через WebAudio, файлов нет. Контекст создаётся и возобновляется на жесте читателя;
     играет на 1-м шлепке и дальше на каждом втором (счёт общий, шлепки по клику тоже), не чаще раза в 0.6 с,
     не при скрытой вкладке, не при reduced-motion и не пока открыта шторка. Громкость ≤ 0.35, переключателя нет ===== */
  var AC=null,swatN=0,meowAt=-1e9,GEST=["pointerdown","touchstart","touchend","click","keydown","wheel"];
  // слушатели остаются: iOS может прервать контекст (звонок, блокировка), следующий жест возобновит его
  var UNL=false;
  function unlockAudio(){
    try{
      if(AC&&AC.state==="running"&&UNL)return;
      if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C()}
      if(!UNL){
        // iOS: тихий буфер внутри жеста открывает звук
        var b=AC.createBuffer(1,1,22050),z=AC.createBufferSource();z.buffer=b;z.connect(AC.destination);z.start(0);UNL=true}
      var p=AC.resume();if(p&&p.catch)p.catch(function(){});
      meowLoad();
    }catch(e){}
  }
  GEST.forEach(function(ev){window.addEventListener(ev,unlockAudio,{capture:true,passive:true})});
  // пять настоящих мяуканий (CC0, Openverse: philsapphire, fthgurdy, d.n.audio.uk, steffcaffrey), случайно, подряд один и тот же не играет
  var MEOW={buf:[],asked:false,last:-1};
  function meowLoad(){
    if(MEOW.asked||!AC)return;MEOW.asked=true;
    for(var k=1;k<=5;k++)(function(k){
      fetch("sounds/meow"+k+".mp3").then(function(r){return r.arrayBuffer()}).then(function(ab){
        return new Promise(function(res,rej){AC.decodeAudioData(ab,res,rej)})}).then(function(b){MEOW.buf[k-1]=b}).catch(function(){})})(k)
  }
  try{var C0=window.AudioContext||window.webkitAudioContext;if(C0){AC=new C0();meowLoad()}}catch(e){AC=null}
  function meow(g){
    var now=performance.now();
    if(!AC||D.hidden||RM||isOpen||now-meowAt<1300)return;
    // тап по лапе — жест: если звук ещё закрыт, открыть и сыграть сразу после resume
    if(AC.state!=="running"){if(g){var pr=AC.resume();if(pr&&pr.then)pr.then(function(){if(AC.state==="running")meow(false)},function(){})}return}
    meowLoad();
    var have=[],i;for(i=0;i<5;i++)if(MEOW.buf[i]&&i!==MEOW.last)have.push(i);
    if(!have.length){if(MEOW.buf.some(Boolean))have=[MEOW.last];else return}
    meowAt=now;var ix=have[Math.floor(Math.random()*have.length)];MEOW.last=ix;
    try{
      var src=AC.createBufferSource(),g=AC.createGain();src.buffer=MEOW.buf[ix];
      src.playbackRate.value=.95+Math.random()*.1;g.gain.value=.85;
      src.connect(g);g.connect(AC.destination);src.start(0);
      src.onended=function(){try{src.disconnect();g.disconnect()}catch(e){}};
    }catch(e){}
  }

  /* ===== лапа играет с листом, пока читатель на финале: серия 4–5 шлепков (толчок листа) → пауза 3–5 с → снова, бесконечно ===== */
  function pawPaused(){return D.hidden||isOpen}
  function pawLoop(){}
  // лапа управляется прокруткой: после падения листа каждый «оборот» скролла — кошка вылезает, шлёпает лист (толчок + мяу) и прячется.
  // Толчки листа копятся: чем больше шлепков, тем дальше сдвинут лист; прокрутил назад — лист возвращается.
  var PAWC=3,pawDone=0,pawVis=false,lastSwat=-1e9;
  function pawEase(t){t=clamp(t,0,1);return t*t*(3-2*t)}
  function pawScroll(q){
    if(q<0||isOpen){if(pawVis){pawVis=false;pawBox.classList.remove("on","hit","sd");pawBox.style.transform="";pawBox.style.opacity="";nudge.style.transform=""}pawDone=0;return}
    var x=q*PAWC,c=Math.min(PAWC-1,Math.floor(x)),u=q>=1?1:x-c,last=c===PAWC-1,
        pe=u<.3?pawEase(u/.3):(u<.45?1:1-pawEase((u-.45)/.3)),slap=u>=.3&&u<.46,k=c+(u>=.3?1:0);// после шлепка лапа уходит целиком (к u=.75) и ждёт следующей прокрутки
    if(!pawVis){pawVis=true;pawBox.classList.add("sd")}
    var hide=PAW.h+30,up=parseFloat(pawBox.style.getPropertyValue("--py-up"))||0;
    pawBox.style.opacity=pe>.01?"1":"0";pawBox.style.translate="0 0";
    pawBox.style.transform="translate3d(0,"+(hide+(up-hide)*pe).toFixed(1)+"px,0)";
    pawBox.classList.toggle("on",pe>.05);
    var hitNow=slap&&paw2OK;if(hitNow!==pawBox.classList.contains("hit"))pawBox.classList.toggle("hit",hitNow);
    if(k>pawDone){pawDone=k;meow()}else if(k<pawDone)pawDone=k;
    var kk=Math.min(k,PAWC),dx=-9*kk,dy=-4*kk,r=-2.2*kk;
    nudge.style.transition="transform .5s cubic-bezier(.2,.8,.2,1)";nudge.style.transform=kk?"translate("+dx+"px,"+dy+"px) rotate("+r+"deg)":"";
  }
  // клик или тап по лапе: сразу шлепок с толчком листа (серия при этом продолжается и скоро кончается)
  pawBox.addEventListener("click",function(){
    if(RM||isOpen||!pawBox.classList.contains("on")||performance.now()-lastSwat<250)return;
    lastSwat=performance.now();meow(true);if(paw2OK){pawBox.classList.add("hit");setTimeout(function(){pawBox.classList.remove("hit")},240)}
  });
  function nudgeSheet(){
    if(!nudge.animate)return;
    var dx=-(10+Math.random()*8),dy=-(3+Math.random()*5),r=-(3+Math.random()*2);// толчок снизу справа: влево-вверх, против часовой
    var tf=function(k){return"translate("+(dx*k)+"px,"+(dy*k)+"px) rotate("+(r*k)+"deg)"};
    nudge.animate([{transform:"none"},{transform:tf(1),offset:.22},{transform:tf(-.35),offset:.5},{transform:tf(.12),offset:.75},{transform:"none"}],{duration:600,easing:"ease-out"});
  }

  /* ===== события ===== */
  window.addEventListener("scroll",requestFrame,{passive:true});
  window.addEventListener("resize",function(){schedule(false)});
  window.addEventListener("orientationchange",function(){schedule(true)});
  D.addEventListener("DOMContentLoaded",function(){schedule(true)});// шапка шагов уже вставлена
  window.addEventListener("load",function(){schedule(true);setTimeout(loadFinal,300)});
  window.addEventListener("pageshow",function(e){if(e.persisted)schedule(true)});
  D.addEventListener("visibilitychange",function(){if(!D.hidden&&pawShow&&!RM)pawLoop(700)});
  // iPhone: после сворачивания вкладки WebKit пару секунд показывает старый кадр наклонного листа (перекос). При возврате прячем сцену на один-два кадра,
  // пересчитываем раскладку и камеру с текущей прокрутки и только потом показываем
  function wakeScene(){if(RM)return;view.style.visibility="hidden";SY=null;schedule(true);requestAnimationFrame(function(){requestAnimationFrame(function(){requestFrame();requestAnimationFrame(function(){view.style.visibility=""})})})}
  D.addEventListener("visibilitychange",function(){if(!D.hidden)wakeScene()});
  window.addEventListener("pageshow",function(e){if(e.persisted)wakeScene()});
  if(D.fonts&&D.fonts.ready)D.fonts.ready.then(function(){schedule(true)});
  if(mq){var onMq=function(){RM=mq.matches;if(RM)showAllReveal();clearTimeout(pawT);pawT=0;pawShow=false;pawBox.classList.remove("on","hit","show");schedule(true)};
    if(mq.addEventListener)mq.addEventListener("change",onMq);else if(mq.addListener)mq.addListener(onMq)}
  // фокус не должен прокручивать скрытый overflow сцены
  view.addEventListener("scroll",function(){if(view.scrollTop||view.scrollLeft){view.scrollTop=0;view.scrollLeft=0}});
  // Tab по блокам: камера подъезжает к блоку (блок на линии чтения)
  content.addEventListener("focusin",function(e){
    if(restoring||RM||isOpen)return;
    var el=e.target.closest&&e.target.closest(".row.blk");if(!el||el._c==null)return;
    var fv=true;try{fv=el.matches(":focus-visible")}catch(_){}
    if(!fv)return;
    var pp=.2+.58*clamp((el._c-RL-y1)/Math.max(1,y2-y1),0,1);
    window.scrollTo(0,stageTop+INTRO+pp*(stageH-window.innerHeight-INTRO));
  });
  // интро-видео: нет файла или ошибка — страница работает без него (без лишней прокрутки)
  layout(true);
})();
