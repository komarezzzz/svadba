<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ebdd">
<meta name="robots" content="noindex,nofollow">
<title>Шаг 1 · Бриф · Виктория и Никита</title>
<link rel="stylesheet" href="core.css">
<style>
/* «Жидкое стекло», итоговая итерация (16.10.2026). Стекло — только слой навигации над живым содержимым: огромными буквами и рисунками тушью.
   Взято с доски референсов: масштаб букв и плоские пастельные полосы (House of Honey, Pentagram), главы и шкала (Tej, History of Muse),
   тёплая бумага и воздух (Kinfolk, Weekend Max Mara), тихая подача (Rosewood, Lambert & Lambert). Без тёмного фона и чёрно-золота. */
@font-face { font-family: "Finlandica"; src: url("fonts/finlandica.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Martian Mono"; src: url("fonts/martian-mono.woff2") format("woff2"); font-weight: 100 800; font-display: swap; }
:root {
  --paper: #f3ebdd; --paper-2: #fbf7ee; --ink: #1b1613; --ink-2: #4a423b; --ink-3: #6a6158; --vermilion: #d2431f; --saffron: #efb73a;
  --want: #1b1613; --maybe: #b57a00; --no: #7b736a;
  --font: "Finlandica", -apple-system, system-ui, sans-serif; --mono: "Martian Mono", ui-monospace, monospace;
  --pad: max(16px, env(safe-area-inset-left));
}
html { scroll-padding-top: 130px; background: var(--paper); }
body { margin: 0; font: 400 17px/1.45 var(--font); color: var(--ink); background: none; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; padding-bottom: 130px; overflow-x: clip; }
::selection { background: color-mix(in oklab, var(--saffron) 55%, #fff); }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 10px; }

/* тёплый свет за всей страницей: даёт стеклу цвет, который можно преломлять */
.light { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--paper); }
.light::before { content: ""; position: absolute; inset: -20%; background:
  radial-gradient(34% 28% at 14% 12%, #f6c7a8 0, transparent 72%), radial-gradient(38% 30% at 90% 20%, #f2d89a 0, transparent 72%),
  radial-gradient(40% 34% at 22% 80%, #e8b9b5 0, transparent 72%), radial-gradient(36% 32% at 88% 86%, #bfd0bd 0, transparent 72%);
  animation: drift 40s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translate3d(3%, -2%, 0) scale(1.08) rotate(3deg); } }

/* ——— материал «жидкое стекло» ——— */
.lg { position: relative; isolation: isolate; border-radius: 30px;
  background: linear-gradient(145deg, rgba(255,255,255,.58), rgba(255,255,255,.24));
  -webkit-backdrop-filter: blur(16px) saturate(200%) brightness(1.05); backdrop-filter: blur(16px) saturate(200%) brightness(1.05);
  box-shadow: inset 1.5px 1.5px 1px -.5px rgba(255,255,255,.95), inset -1.5px -1.5px 1px -.5px rgba(255,255,255,.6), inset 0 -14px 22px -14px rgba(255,255,255,.5),
    0 22px 44px -16px rgba(60,30,10,.4), 0 3px 8px rgba(60,30,10,.14); }
.lg::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none; z-index: 2;
  background: conic-gradient(from 215deg, rgba(255,255,255,.98), rgba(255,255,255,.05) 18%, rgba(255,255,255,.6) 52%, rgba(255,255,255,.05) 74%, rgba(255,255,255,.98));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.lens .lg { -webkit-backdrop-filter: var(--lens, blur(16px)) saturate(200%) brightness(1.05); backdrop-filter: var(--lens, blur(16px)) saturate(200%) brightness(1.05); }
@media (prefers-reduced-transparency: reduce) { .lg, .lens .lg, .cr-sheet, .pic .cr-seg { background: #fff !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; } .lg::after { display: none; } }
@media (prefers-contrast: more) { .lg { background: #fff; } .lg::after { background: var(--ink); } }

/* ——— шапка: имя пары, счётчик, главы и шкала вечера ——— */
.top { position: fixed; z-index: 30; top: max(10px, env(safe-area-inset-top)); left: var(--pad); right: var(--pad); max-width: 760px; margin: 0 auto; padding: 8px 8px 10px; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 2px 8px 8px 12px; max-height: 60px; overflow: hidden; transition: max-height .45s cubic-bezier(.16,1,.3,1), padding .45s, opacity .3s; }
.compact .top-row { max-height: 0; padding-top: 0; padding-bottom: 0; opacity: 0; }
.who b { display: block; font: 800 20px/1.05 var(--font); letter-spacing: -.025em; }
.who span { display: block; margin-top: 2px; font: 600 13.5px/1.2 var(--font); color: var(--ink-2); }
.cnt { flex: none; font: 600 12.5px/1 var(--mono); background: rgba(255,255,255,.6); border-radius: 999px; padding: 9px 12px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.75); }
.tabs { position: relative; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding: 3px; border-radius: 999px; background: rgba(60,40,20,.1); }
.tabs::-webkit-scrollbar { display: none; }
.tabs .thumb { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,255,255,.82)); box-shadow: 0 4px 14px -4px rgba(60,30,10,.4), inset 0 1px 0 #fff; transition: transform .5s cubic-bezier(.3,1.35,.5,1), width .5s cubic-bezier(.3,1.35,.5,1); pointer-events: none; }
.tab { position: relative; z-index: 1; flex: none; border: 0; background: none; min-height: 44px; padding: 0 14px; border-radius: 999px; font: 650 15px/1 var(--font); color: var(--ink); white-space: nowrap; }
.scale { display: flex; gap: 3px; height: 5px; margin: 9px 10px 0; }
.scale i { flex: var(--w) 1 0; border-radius: 3px; background: rgba(60,40,20,.14); overflow: hidden; position: relative; }
.scale i::after { content: ""; position: absolute; inset: 0; width: calc(var(--p, 0) * 100%); background: hsl(var(--h) 38% 46%); border-radius: inherit; transition: width .6s cubic-bezier(.16,1,.3,1); }

main { max-width: 1240px; margin: 0 auto; padding: 0 var(--pad); }
@media (max-width: 759px) { main { overflow-x: clip; } }

/* ——— вводный экран: огромные буквы, рисунок-герой, стеклянные слои ——— */
.hero { position: relative; padding: calc(var(--panel-b, 141px) + 38px) 0 56px; }
.giant { position: relative; z-index: 3; margin: 0; font: 900 clamp(118px, 29vw, 330px)/.78 var(--font); letter-spacing: -.055em; text-transform: uppercase; color: var(--ink);
  -webkit-text-stroke: clamp(4px, .8vw, 9px) var(--paper); paint-order: stroke fill; pointer-events: none; }
.giant span { display: block; }
.giant span + span { margin-left: .02em; }
.hero-wrap { position: relative; }
.hero-art { position: relative; z-index: 1; margin: -.34em 0 0 12%; border-radius: clamp(26px, 4vw, 48px); overflow: hidden; box-shadow: 0 40px 70px -34px rgba(60,30,10,.55); background: var(--paper-2); aspect-ratio: 3 / 2; }
.hero-art img { width: 100%; height: 100%; object-fit: cover; }
.hero-glass { position: absolute; z-index: 4; left: 0; bottom: 8px; width: min(420px, 82%); padding: 22px 24px 20px; border-radius: 34px; }
.hero-glass .pair { margin: 0; font: 800 clamp(30px, 4.2vw, 46px)/1 var(--font); letter-spacing: -.035em; }
.hero-glass .sum { margin: 10px 0 0; font: 500 12.5px/1.45 var(--mono); color: var(--ink-2); }
.hero-glass .how { margin: 12px 0 16px; font-size: 16px; color: var(--ink); max-width: 30ch; }
.go2 { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border-radius: 999px; background: var(--ink); color: #fff; text-decoration: none; font: 700 16px/1 var(--font); box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
.orb { position: absolute; z-index: 4; right: 16px; top: 16px; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); text-decoration: none; }
.orb svg { width: 22px; height: 22px; }
@media (max-width: 959px) {
  .hero { padding-bottom: 110px; }
  .hero-art { margin: -.3em 0 0 0; aspect-ratio: 4 / 3; }
  .hero-art img { object-position: 52% 50%; }
  .hero-glass { left: 8px; width: calc(100% - 16px); bottom: -28px; padding: 18px 20px 18px; }
  .hero-glass .how { display: none; }
  .hero-glass .go2 { margin-top: 12px; }
}
@media (min-width: 960px) {
  .hero { padding-bottom: 70px; }
  .giant { font-size: clamp(190px, 15.6vw, 280px); width: 52%; }
  .hero-art { position: absolute; z-index: 1; top: 40px; right: 0; width: 60%; margin: 0; }
  .hero-glass { left: 27%; top: 300px; bottom: auto; }
  .hero-wrap { min-height: 640px; }
}
@media (min-width: 960px) and (max-height: 820px) {
  .hero-glass { top: 252px; }
  .hero-glass .how { display: none; }
}

/* ——— главы: пастельная полоса, огромный номер, карточки без рамок ——— */
.stage { --h: 28; position: relative; margin: 0 calc(var(--pad) * -1); padding: 56px var(--pad) 54px; border-radius: 40px 40px 0 0; margin-top: -26px; overflow: hidden;
  background: linear-gradient(180deg, hsl(var(--h) 50% 89%), hsl(var(--h) 42% 92%) 70%, rgba(243,235,221,0)); scroll-margin-top: 112px; }
.stage-in { position: relative; max-width: 1240px; margin: 0 auto; }
.num { position: absolute; z-index: 0; right: -1vw; top: -.2em; font: 900 clamp(150px, 26vw, 340px)/.8 var(--font); letter-spacing: -.06em; color: hsl(var(--h) 46% 77%); pointer-events: none; user-select: none; }
.stage-head { position: relative; z-index: 1; max-width: 60ch; padding-top: 12px; }
.stage h2 { margin: 0; font: 850 clamp(40px, 8.4vw, 92px)/.92 var(--font); letter-spacing: -.045em; text-wrap: balance; }
.when { margin: 14px 0 0; font: 600 12.5px/1.35 var(--mono); color: var(--ink-2); }
.lead { margin: 10px 0 0; max-width: 46ch; font-size: 18px; color: var(--ink-2); }
.grid { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(6, 1fr); gap: 46px 24px; margin-top: 40px; }
.item { position: relative; grid-column: span 2; }
.item.s3 { grid-column: span 3; } .item.s6 { grid-column: span 6; }
.pic { position: relative; aspect-ratio: 3 / 2; border-radius: 30px; overflow: hidden; background: var(--paper-2); box-shadow: 0 30px 40px -28px rgba(60,30,10,.5); }
.item.s6 .pic { aspect-ratio: 2 / 1; border-radius: 40px; }
.item.s6 .pic .cr-seg { left: 50%; right: auto; width: min(480px, calc(100% - 24px)); translate: -50% 0; }
.pic img { width: 100%; height: 100%; object-fit: cover; transition: transform .9s cubic-bezier(.16,1,.3,1), filter .3s; }
.item:hover .pic img { transform: scale(1.025); }
.chip { position: absolute; left: 12px; top: 12px; z-index: 2; padding: 8px 12px; border-radius: 999px; font: 650 12px/1 var(--mono); background: rgba(255,255,255,.58); -webkit-backdrop-filter: blur(14px) saturate(190%); backdrop-filter: blur(14px) saturate(190%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.75), 0 6px 14px -6px rgba(60,30,10,.4); }
.badge { position: absolute; right: 12px; top: 12px; z-index: 2; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--want); box-shadow: 0 8px 16px -6px rgba(0,0,0,.5); transform: scale(0); transition: transform .45s cubic-bezier(.3,1.7,.5,1); }
.item[data-v] .badge { transform: scale(1); } .item[data-v=""] .badge { transform: scale(0); }
.item[data-v="maybe"] .badge { background: var(--maybe); } .item[data-v="no"] .badge { background: var(--no); }
.item[data-v="no"] .pic img { filter: grayscale(.9) contrast(.92); } .item[data-v="no"] .txt { opacity: .6; }
.item[data-v="yes"] .pic { box-shadow: 0 30px 40px -28px rgba(60,30,10,.5), 0 0 0 3px var(--paper), 0 0 0 5px var(--ink); }
/* переключатель — стеклянная пилюля прямо на рисунке */
.pic .cr-seg { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 3; padding: 4px; border-radius: 24px;
  background: linear-gradient(145deg, rgba(255,255,255,.5), rgba(255,255,255,.2)); -webkit-backdrop-filter: blur(16px) saturate(200%) brightness(1.06); backdrop-filter: blur(16px) saturate(200%) brightness(1.06);
  box-shadow: inset 1.5px 1.5px 1px -.5px rgba(255,255,255,.95), inset -1.5px -1.5px 1px -.5px rgba(255,255,255,.55), 0 14px 26px -12px rgba(40,20,5,.5); }
.cr-seg i { background: #fff; border-radius: 20px; box-shadow: 0 3px 10px -2px rgba(60,30,10,.35); }
.cr-seg button { font: 700 15px/1 var(--font); color: var(--ink); border-radius: 20px; gap: 5px; min-height: 46px; }
.cr-seg button[aria-pressed="true"][data-k="yes"] { color: #0b6b36; } .cr-seg button[aria-pressed="true"][data-k="maybe"] { color: #8a5a00; } .cr-seg button[aria-pressed="true"][data-k="no"] { color: var(--ink-2); }
.cr-seg .cr-ico svg { width: 15px; height: 15px; }
.cr-seg:not([data-set="1"]) .cr-ico { display: none; } .cr-seg[data-set="1"] button:not([aria-pressed="true"]) .cr-ico { display: none; }
.txt { padding: 16px 6px 0; }
.txt h3 { margin: 0 0 6px; font: 800 clamp(22px, 2.3vw, 28px)/1.08 var(--font); letter-spacing: -.028em; text-wrap: balance; }
.item.s6 .txt h3 { font-size: clamp(28px, 3.4vw, 42px); }
.txt h3 button { all: unset; cursor: pointer; display: block; }
.txt h3 button:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; border-radius: 8px; }
/* карточка в ленте: карусель заполняет рамку рисунка; пауза слева от значка выбора, точки сверху, стрелки только в шторке */
.pic.feed { cursor: pointer; }
.pic.feed > .cr-pic { position: absolute; inset: 0; margin: 0; border-radius: inherit; box-shadow: none; background: transparent; }
.pic.feed .cr-track, .pic.feed .cr-slide { height: 100%; } .pic.feed .cr-slide { aspect-ratio: auto; }
.pic.feed .cr-nav { display: none; }
.pic.feed .cr-dots { top: 8px; bottom: auto; }
.pic.feed .cr-pp { top: 8px; right: 56px; width: 40px; height: 40px; }
.pic.feed .cr-pic.single .cr-pp { display: none; }
/* оглавление и подразделы этапа */
.toc { position: relative; z-index: 2; max-width: 1240px; margin: 0 auto; padding: 38px 0 84px; }
.toc-h { margin: 0; font: 850 clamp(34px, 5.5vw, 64px)/.95 var(--font); letter-spacing: -.04em; }
.toc-s { margin: 8px 0 24px; font: 600 12.5px/1.35 var(--mono); color: var(--ink-2); }
.toc-l { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 12px; align-items: start; }
.toc-l { grid-auto-flow: dense; align-items: stretch; }
.toc-l > li:not(:has(ul)) a { min-height: 100%; align-items: start; }
@media (min-width: 640px) { .toc-l > li:has(ul) { grid-row: span 2; } }
.toc-l > li { border-radius: 28px; padding: 5px; background: hsl(var(--h) 60% 91%); box-shadow: inset 0 0 0 1px hsl(var(--h) 40% 78% / .7); }
.toc-l a { display: grid; grid-template-columns: auto 1fr auto; align-items: baseline; gap: 12px; min-height: 48px; padding: 11px 14px; border-radius: 22px; color: var(--ink); text-decoration: none; transition: background .2s; }
.toc-l a:hover { background: rgba(255,255,255,.6); }
.toc-l a:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }
.toc-l b { font: 800 13px/1 var(--mono); color: hsl(var(--h) 45% 34%); }
.toc-l .t { font: 800 21px/1.1 var(--font); letter-spacing: -.02em; text-wrap: balance; }
.toc-l small { font: 700 13px/1 var(--mono); color: var(--ink-2); }
.toc-l ul { list-style: none; margin: 0; padding: 0 6px 8px 40px; }
.toc-l ul a { grid-template-columns: 1fr auto; min-height: 44px; padding: 8px 10px; font: 600 15.5px/1.2 var(--font); border-radius: 16px; }
.sub { position: relative; z-index: 1; margin-top: 64px; scroll-margin-top: 112px; }
.stage-head + .sub { margin-top: 44px; }
.sub-h { margin: 0; display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 14px; padding-top: 16px; border-top: 2px solid hsl(var(--h) 38% 50% / .5); font: 850 clamp(26px, 3.6vw, 44px)/1.02 var(--font); letter-spacing: -.035em; text-wrap: balance; }
.sub-h small { padding: 7px 11px; border-radius: 999px; background: rgba(255,255,255,.62); font: 700 13px/1 var(--mono); letter-spacing: 0; color: var(--ink-2); }
.sub-lead { margin: 8px 0 0; max-width: 56ch; font-size: 16px; color: var(--ink-2); }
.sub .grid { margin-top: 26px; }
.stage-head + .grid { margin-top: 40px; }
.bankbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 54px 0 0; font: 600 13px/1.2 var(--mono); color: var(--ink-2); }
.bankbar a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid rgba(60,40,20,.35); color: var(--ink); text-decoration: none; font: 650 15px/1 var(--font); background: rgba(255,255,255,.5); }
.bankbar a[aria-current="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
@media (min-width: 960px) { .bankbar { position: absolute; z-index: 4; left: 0; top: calc(var(--panel-b, 141px) + 440px); width: 24%; margin: 0; flex-direction: column; align-items: flex-start; } }
.txt p { margin: 0; max-width: 52ch; font-size: 16px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tg { display: inline-block; margin-top: 8px; font: 600 11.5px/1 var(--mono); letter-spacing: .02em; color: var(--ink-3); }
.stage-note { position: relative; z-index: 1; margin-top: 22px; }
.stage-note .cr-link { color: var(--ink); font: 700 16px/1 var(--font); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }
.stage-note .cr-fld { background: rgba(255,255,255,.8); border: 1px solid rgba(60,40,20,.2); border-radius: 18px; padding: 12px 14px; min-height: 84px; font-size: 17px; }

/* ——— нижняя стеклянная панель ——— */
.dock { position: fixed; z-index: 30; left: var(--pad); right: var(--pad); bottom: max(12px, env(safe-area-inset-bottom)); max-width: 540px; margin: 0 auto; padding: 10px 10px 10px 20px; border-radius: 34px; display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: center; }
.dock .t { font-size: 15px; line-height: 1.2; } .dock .t b { font: 700 14px/1 var(--mono); }
.dock .t small { display: block; margin-top: 3px; font: 500 12px/1.2 var(--mono); color: var(--ink-2); }
.strip { grid-column: 1; height: 6px; border-radius: 3px; overflow: hidden; display: flex; background: rgba(60,40,20,.14); }
.strip i { height: 100%; width: calc(var(--m) * 1%); background: hsl(var(--c) 38% 46%); transition: width .6s cubic-bezier(.16,1,.3,1); }
.go { grid-row: 1 / span 2; grid-column: 2; min-height: 52px; padding: 0 24px; border: 0; border-radius: 26px; font: 800 17px/1 var(--font); color: #fff; background: linear-gradient(180deg, #e0522d, var(--vermilion)); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.4), inset 0 -3px 8px -2px rgba(100,20,0,.4), 0 10px 20px -10px rgba(120,30,0,.7); transition: transform .2s; }
.go:active { transform: scale(.96); }

/* ——— шторка (карточка и итог) ——— */
.cr-scrim { background: rgba(40,24,10,.42); transition: opacity .35s; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.cr-sheet { border-radius: 36px 36px 0 0; background: linear-gradient(180deg, rgba(251,247,238,.86), rgba(246,239,226,.78)); -webkit-backdrop-filter: blur(44px) saturate(200%); backdrop-filter: blur(44px) saturate(200%); box-shadow: inset 0 1.5px 1px rgba(255,255,255,.95), 0 -24px 60px -20px rgba(40,20,5,.55); }
.cr-grab { background: rgba(60,40,20,.3); }
.cr-sheet-body { padding: 4px 20px calc(26px + env(safe-area-inset-bottom)); }
.cr-pic { border-radius: 26px; background: var(--paper-2); margin-top: 6px; box-shadow: 0 14px 28px -16px rgba(60,30,10,.5); }
.cr-pp, .cr-nav { border-radius: 50%; color: var(--ink); background: rgba(255,255,255,.7); -webkit-backdrop-filter: blur(14px) saturate(180%); backdrop-filter: blur(14px) saturate(180%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.8), 0 6px 14px -6px rgba(60,30,10,.5); }
.cr-nav { top: auto; bottom: 6px; margin-top: 0; width: 38px; height: 38px; } .cr-prev { left: 10px; } .cr-next { right: 10px; }
.cr-dot::before { background: rgba(60,40,20,.34); } .cr-dot.on::before { background: var(--ink); }
.cr-sheet h2 { margin: 16px 0 8px; font: 850 clamp(30px, 6vw, 40px)/1.02 var(--font); letter-spacing: -.035em; text-wrap: balance; }
.cr-sheet p { margin: 0 0 12px; font-size: 17px; }
.cr-facts { border-radius: 20px; background: rgba(255,255,255,.62); margin: 4px 0 14px; overflow: hidden; }

<style>

  .secnav{position:sticky;top:136px;z-index:4;display:flex;gap:6px;overflow-x:auto;padding:6px;margin:18px 0 0;border-radius:999px;background:rgba(255,255,255,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);scrollbar-width:none}

  .sec{--h:28;margin-top:28px;background:rgba(255,255,255,.5);border-radius:28px;overflow:hidden;box-shadow:0 10px 30px -18px rgba(60,30,10,.4);scroll-margin-top:70px}

  .sec h2{display:inline-flex;align-items:center;gap:12px;margin:4px 0 16px;padding:8px 18px 8px 8px;border-radius:999px;background:hsl(var(--h) 80% 92%);font:850 clamp(36px,9vw,44px)/1.1 var(--font);letter-spacing:-.03em;color:hsl(var(--h) 45% 24%)}

  .qbadge{display:inline-block;margin:0 4px;padding:3px 9px;border-radius:999px;background:#ffe27a;color:#5a4300;font:700 13px/1.2 var(--font);box-shadow:inset 0 0 0 1px rgba(120,90,0,.25)}

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs id="lensdefs"></defs></svg>
<div class="light" aria-hidden="true"></div>
<header class="top lg" id="top">
  <div class="top-row"><div class="who"><b>Ваш вечер</b><span>Виктория и Никита</span></div></div>
  <nav class="tabs" id="tabs" aria-label="Шаги"><i class="thumb" aria-hidden="true"></i><a class="tab" href="brief.html" aria-current="true">1 · Бриф</a><a class="tab" href="index.html">2 · Программа</a></nav>
</header>
<main class="brief" id="main">
  <section class="hero-b" aria-label="Заголовок">
    <h1>Виктория и Никита</h1>
    <p>Бриф · 7 ноября 2026</p>
  </section>
  <p class="meta">Шаг 1 · ответы пары дословно, как пришли на Google Диск. Пустых полей нет. Пометки «уточнить» — только то, что пара сама оставила с «?».</p>
  <nav class="secnav" id="secnav" aria-label="Разделы брифа"></nav>
  <div id="content"></div>
</main>
<script>
(async () => {
  const text = await (await fetch("brief-text.md")).text();
  const out = document.getElementById('content');
  const nav = document.getElementById('secnav');
  const HUES = [285, 22, 46, 350, 205, 150, 95];
  const LONG = 400;
  let sec = null, grid = null, card = null, n = 0;
  // «(?)» и слово «уточнить» — жёлтые бейджи
  const withBadges = (p, t) => {
    t.split(/(\(\?\)|уточнить)/i).forEach(part => {
      if (!part) return;
      if (/^\(\?\)$|^уточнить$/i.test(part)) { const b = document.createElement('span'); b.className = 'qbadge'; b.textContent = 'уточнить'; p.appendChild(b); }
      else p.appendChild(document.createTextNode(part));
    });
  };
  for (const raw of text.split('\n')) {
    const line = raw.trimEnd();
    if (line.startsWith('# ')) continue;
    if (line.startsWith('## ')) {
      n++;
      sec = document.createElement('section');
      sec.className = 'sec';
      sec.id = 's' + n;
      sec.style.setProperty('--h', HUES[(n - 1) % HUES.length]);
      const inner = document.createElement('div');
      inner.className = 'sec-in';
      const h = document.createElement('h2');
      const num = document.createElement('span');
      num.className = 'secnum';
      num.textContent = String(n).padStart(2, '0');
      h.append(num, line.slice(3));
      grid = document.createElement('div');
      grid.className = 'qs';
      inner.append(h, grid);
      sec.appendChild(inner);
      out.appendChild(sec);
      const a = document.createElement('a');
      a.href = '#' + sec.id;
      a.textContent = String(n).padStart(2, '0') + ' · ' + line.slice(3);
      nav.appendChild(a);
      card = null;
      continue;
    }
    const parent = grid || out;
    if (!line.trim()) { card = null; continue; }
    const m = line.match(/^\*\*(.+?)\*\*\s*(.*)$/);
    if (m) {
      card = document.createElement('div');
      card.className = 'q';
      const b = document.createElement('b');
      b.textContent = m[1];
      card.appendChild(b);
      parent.appendChild(card);
      if (m[2]) {
        const p = document.createElement('p');
        withBadges(p, m[2]);
        card.appendChild(p);
      }
      continue;
    }
    if (!card) {
      card = document.createElement('div');
      card.className = 'q';
      parent.appendChild(card);
    }
    const p = document.createElement('p');
    // «- Виктория: …» — имя отвечающего подписью над ответом
    const who = line.match(/^- ([^:]{2,24}):\s*(.*)$/);
    if (who) {
      const s = document.createElement('strong');
      s.textContent = who[1];
      p.appendChild(s);
      withBadges(p, who[2]);
    } else withBadges(p, line.replace(/^- /, '• '));
    card.appendChild(p);
  }
  // ответы по людям: «• Виктория: …» и «• Никита: …» — две карточки рядом; общий ответ — одна карточка на всю ширину
  const PEOPLE = ['Виктория', 'Никита'];
  // ответы по людям: строка «- Имя: …» (имя в <strong>) — две карточки рядом; общий ответ — одна карточка на всю ширину
  const who = p => { const s0 = p.querySelector(':scope > strong'); return s0 && PEOPLE.includes(s0.textContent) ? s0.textContent : null; };
  document.querySelectorAll('.q').forEach(c => {
    const ps = [...c.querySelectorAll(':scope > p')];
    if (!ps.some(p => who(p))) return;
    const grid = document.createElement('div');
    grid.className = 'pp';
    PEOPLE.forEach(nm => {
      const items = ps.filter(p => who(p) === nm);
      if (!items.length) return;
      const pc = document.createElement('div');
      pc.className = 'pc ' + (nm === 'Виктория' ? 'vic' : 'nik');
      const lab = document.createElement('b');
      lab.textContent = nm;
      pc.appendChild(lab);
      items.forEach(p => { p.querySelector(':scope > strong').remove(); pc.appendChild(p); });
      grid.appendChild(pc);
    });
    c.classList.add('split');
    c.appendChild(grid);
  });
  // длинные ответы: полный текст на месте, видна часть, остальное — по кнопке (в каждой карточке отдельно)
  document.querySelectorAll('.q:not(.split), .pc').forEach(c => {
    const ps = [...c.querySelectorAll(':scope > p')];
    const len = ps.reduce((k, p) => k + p.textContent.length, 0);
    if (len > LONG) {
      const wrap = document.createElement('div');
      wrap.className = 'ans clamp';
      ps.forEach(p => wrap.appendChild(p));
      c.appendChild(wrap);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'more';
      btn.textContent = 'Читать полностью';
      btn.setAttribute('aria-expanded', 'false');
      btn.onclick = () => {
        const open = wrap.classList.toggle('open');
        wrap.classList.toggle('clamp', !open);
        btn.textContent = open ? 'Свернуть' : 'Читать полностью';
        btn.setAttribute('aria-expanded', String(open));
      };
      c.appendChild(btn);
    } else if (c.classList.contains('q') && ps.length === 1 && len <= 60) {
      c.classList.add('short');
    }
  });
})();
</script>

<script>
(() => { const a = document.querySelector('#tabs a[aria-current]'), t = document.querySelector('#tabs .thumb'); if (a && t) { t.style.width = a.offsetWidth + 'px'; t.style.transform = 'translateX(' + a.offsetLeft + 'px)'; } })();
</script>
</body>
